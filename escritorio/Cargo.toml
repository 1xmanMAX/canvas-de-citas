[package]
name = "canvas-de-citas"
version = "1.7.1"
edition = "2021"
description = "Canvas de Citas para Windows: la app (incluida en el exe) en su propia ventana (WebView2), con sus carpetas y la sincronización por Wi-Fi"
publish = false

# Proyecto propio (no pertenece a ningún workspace).
[workspace]

[dependencies]
canvas-sincro = { path = "../receptor/sincro" }
tao = "0.37"
wry = "0.57"

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
winresource = "0.1"
